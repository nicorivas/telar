name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # El multiplexor no lo usan las pruebas de hoy, pero las del mux sí lo van
      # a necesitar, y es mejor que esté desde el principio que descubrirlo tarde.
      - name: tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - name: Instalar telar
        run: |
          python -m pip install --upgrade pip
          # con sus extras: la API (serve) y el bus tienen pruebas propias que, sin ellos, se saltan
          pip install -e '.[serve,bus,pruebas]'

      - name: Compilar todo
        run: python -m compileall -q src pruebas

      - name: Pruebas
        run: python -m unittest discover -s pruebas -v

      - name: La CLI responde
        run: |
          telar --version
          telar --help

  pagina:
    # La página (pagina/, empaquetada en src/telar/web/): que sus tipos cierren, que lo commiteado en
    # src/telar/web sea lo que sale de compilarla, y la prueba del eco de la terminal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pagina/package-lock.json
      - run: npm ci
        working-directory: pagina
      - run: npm run tipos
        working-directory: pagina
      - name: Lo commiteado es lo compilado
        run: |
          (cd pagina && npm run -s navegador)
          git diff --exit-code src/telar/web || { echo "::error::src/telar/web no es lo que sale de compilar pagina/: npm run navegador y commitear"; exit 1; }
      - run: npm run prueba:eco
        working-directory: pagina
      - run: npm run prueba:enlaces
        working-directory: pagina
      - run: npm run prueba:semana
        working-directory: pagina

  mod:
    # El mod de telar para Claude Code (src/telar/mod/): que Claude Code lo lea como se debe y que sus
    # pruebas pasen. `claude plugin test` corre sin sesión, sin cuenta y sin red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validar el mod
        run: claude plugin validate --strict src/telar/mod
      - name: Pruebas del mod
        working-directory: src/telar/mod
        run: claude plugin test
      - name: La sordina
        run: |
          claude plugin validate --strict src/telar/sordina
          (cd src/telar/sordina && claude plugin test)

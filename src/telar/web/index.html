<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2e3440">
  <title>telar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // el tema se pone antes de pintar, para que no parpadee: oscuro por defecto, claro si se eligió
    try { if (localStorage.getItem('telar.tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sin almacenamiento */ }
  </script>
  <link rel="stylesheet" href="estilo.css">
  <script>
    // Chrome solo ofrece «Instalar app» si hay un service worker; este no guarda nada (la página se edita en vivo)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><pre id="telar-ascii"></pre><div class="splash-t">telar<span class="cursor">▊</span></div></div>
  <script>
    // el telar teje unas filas y se va; solo la primera vez de cada sesión, para que la recarga automática no lo repita
    (() => {
      const s = document.getElementById('splash');
      let visto = false;
      try { visto = sessionStorage.getItem('telar.splash') === '1'; sessionStorage.setItem('telar.splash', '1'); } catch (e) { /* sin almacenamiento */ }
      if (visto || matchMedia('(prefers-reduced-motion: reduce)').matches) { s.remove(); return; }
      const W = 23, H = 7, pre = document.getElementById('telar-ascii');
      const trama = (r, c) => (c % 2 === 0 ? ((r + (c >> 1)) % 2 ? '┼' : '│') : '─');
      let t = 0;
      const dibuja = () => {
        const fila = Math.floor(t / W), col = t % W, der = fila % 2 === 0;
        const lineas = ['╔' + '═'.repeat(W) + '╗'];
        for (let r = 0; r < H; r++) {
          let l = '';
          for (let c = 0; c < W; c++) {
            const tejida = r < fila || (r === fila && (der ? c <= col : c >= W - 1 - col));
            l += tejida ? trama(r, c) : (c % 2 === 0 ? '│' : ' ');
          }
          if (r === fila) {  // la lanzadera va en la punta del hilo
            const x = der ? col : W - 1 - col;
            l = (l.slice(0, x) + '◆' + l.slice(x + 1));
          }
          lineas.push('║' + l + '║');
        }
        lineas.push('╚' + '═'.repeat(W) + '╝');
        pre.textContent = lineas.join('\n');
      };
      dibuja();
      const paso = setInterval(() => { t += 2; dibuja(); if (t >= W * H) { clearInterval(paso); s.classList.add('fuera'); setTimeout(() => s.remove(), 400); } }, 28);
      s.onclick = () => { clearInterval(paso); s.remove(); };
    })();
  </script>
  <header class="top">
    <div class="marca-t"><span class="logo">telar</span><span class="cursor" aria-hidden="true">▊</span><span id="fecha" class="fecha"></span></div>
    <div class="der">
      <button id="menu" type="button" aria-label="menú" aria-haspopup="true" aria-expanded="false">⋮</button>
      <div id="menu-panel" role="menu" hidden>
        <button id="tema" type="button" role="menuitem" aria-label="cambiar entre tema oscuro y claro"><span id="icono-tema" class="g">☀</span> <span id="texto-tema">tema claro</span></button>
        <button id="recargar" type="button" role="menuitem"><span class="g">↻</span> actualizar <span id="aviso" class="dim"></span></button>
      </div>
    </div>
  </header>
  <main id="vista" aria-live="polite"></main>
  <footer id="barra">
    <a href="#hoy" data-vista="hoy">hoy</a>
    <a href="#hilos" data-vista="hilos">hilos</a>
    <a href="#plan" data-vista="plan" id="tab-plan" hidden>plan</a>
    <a href="#cal" data-vista="cal">cal</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2e3440">
  <title>telar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // el tema se pone antes de pintar, para que no parpadee: oscuro por defecto, claro si se eligió
    try { if (localStorage.getItem('telar.tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sin almacenamiento */ }
  </script>
  <link rel="stylesheet" href="estilo.css">
  <script>
    // Chrome solo ofrece «Instalar app» si hay un service worker; este no guarda nada (la página se edita en vivo)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><pre id="telar-ascii"></pre></div>
  <script>
    // el telar teje la pantalla entera y se va; solo la primera vez de cada sesión, para que la recarga automática no lo repita
    (() => {
      const s = document.getElementById('splash'), pre = document.getElementById('telar-ascii');
      let visto = false;
      try { visto = sessionStorage.getItem('telar.splash') === '1'; sessionStorage.setItem('telar.splash', '1'); } catch (e) { /* sin almacenamiento */ }
      if (visto || matchMedia('(prefers-reduced-motion: reduce)').matches) { s.remove(); return; }
      const medida = document.createElement('span'); medida.textContent = 'M'.repeat(20); medida.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
      pre.append(medida);
      const cw = medida.getBoundingClientRect().width / 20 || 8, ch = parseFloat(getComputedStyle(pre).lineHeight) || 16;
      // ancho y alto impares y la grilla centrada en la pantalla, para que el nombre quede en el medio justo
      const impar = (n) => (n % 2 ? n : n - 1);
      const W = impar(Math.max(21, Math.floor(innerWidth / cw))), H = impar(Math.max(9, Math.floor(innerHeight / ch))), mid = W >> 1;
      pre.style.cssText = 'left:' + (innerWidth - W * cw) / 2 + 'px;top:' + (innerHeight - H * ch) / 2 + 'px;right:auto;bottom:auto;width:' + W * cw + 'px;height:' + H * ch + 'px';
      const TITULO = '« t e l a r »', t0 = mid - (TITULO.length >> 1), rt = H >> 1;
      const BANDAS = ['a', 'c', 'm', 'v'];  // el color de cada banda del tejido: azul, cian, magenta, verde
      // la celda tejida: cruce de urdimbre y trama, con un rombo de motivos que baja por el centro
      const celda = (r, c) => {
        const banda = BANDAS[Math.floor(r / 5) % BANDAS.length], d = Math.abs(c - mid), k = (d + r) % 10;
        if (c % 2 === 0) {
          if (k === 0) return ['y', '◈'];
          if (k === 5) return ['y', '✦'];
          return [banda, (r + (c >> 1)) % 2 ? '╬' : '║'];
        }
        return [banda, (r + (c >> 2)) % 2 ? '═' : '┈'];
      };
      let t = 0;
      const dibuja = (fin) => {
        const fila = Math.floor(t / W), col = t % W, der = fila % 2 === 0, x = der ? col : W - 1 - col;
        let html = '';
        for (let r = 0; r < H; r++) {
          let cls = '', run = '';
          const vuelca = () => { if (run) html += cls ? '<i class="' + cls + '">' + run + '</i>' : run; run = ''; };
          for (let c = 0; c < W; c++) {
            let k, g;
            const enCaja = Math.abs(r - rt) <= 2 && c >= t0 - 4 && c < t0 + TITULO.length + 4;
            if (enCaja && (r < fila || fin)) {  // un claro en el tejido para el nombre, con marco
              const borde = Math.abs(r - rt) === 2, lado = c === t0 - 4 || c === t0 + TITULO.length + 3;
              if (borde) { k = 'y'; g = lado ? (c === t0 - 4 ? (r < rt ? '╭' : '╰') : (r < rt ? '╮' : '╯')) : '─'; }
              else if (lado) { k = 'y'; g = '│'; }
              else if (r === rt && c >= t0 && c < t0 + TITULO.length) { k = 't'; g = TITULO[c - t0]; }
              else { k = 't'; g = ' '; }
            }
            else if (enCaja && !(r < fila || fin)) { k = 'd'; g = c % 2 === 0 ? '│' : ' '; }
            else if (r === fila && c === x && !fin) { k = 'y'; g = '◆'; }
            else if (r < fila || fin || (r === fila && (der ? c < x : c > x))) [k, g] = celda(r, c);
            else { k = 'd'; g = c % 2 === 0 ? '│' : ' '; }
            if (k !== cls) { vuelca(); cls = k; }
            run += g;
          }
          vuelca();
          html += r < H - 1 ? '\n' : '';
        }
        pre.innerHTML = html;
      };
      dibuja();
      const paso = setInterval(() => {
        t += Math.ceil(W / 2);
        if (t >= W * H) { clearInterval(paso); dibuja(true); setTimeout(() => s.classList.add('fuera'), 450); setTimeout(() => s.remove(), 900); }
        else dibuja();
      }, 30);
      s.onclick = () => { clearInterval(paso); s.remove(); };
    })();
  </script>
  <header class="top">
    <div class="marca-t"><span class="logo">telar</span><span class="cursor" aria-hidden="true">▊</span><span id="fecha" class="fecha"></span></div>
    <div class="der">
      <button id="menu" type="button" aria-label="menú" aria-haspopup="true" aria-expanded="false">⋮</button>
      <div id="menu-panel" role="menu" hidden>
        <button id="tema" type="button" role="menuitem" aria-label="cambiar entre tema oscuro y claro"><span id="icono-tema" class="g">☀</span> <span id="texto-tema">tema claro</span></button>
        <button id="recargar" type="button" role="menuitem"><span class="g">↻</span> actualizar <span id="aviso" class="dim"></span></button>
      </div>
    </div>
  </header>
  <main id="vista" aria-live="polite"></main>
  <footer id="barra">
    <a href="#hoy" data-vista="hoy">hoy</a>
    <a href="#hilos" data-vista="hilos">hilos</a>
    <a href="#plan" data-vista="plan" id="tab-plan" hidden>plan</a>
    <a href="#cal" data-vista="cal">cal</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>telar</title>
<link rel="stylesheet" href="/estatico/marco.css"></head><body class="en-lista">
<header>
  <div class="izq"><span class="logo">telar</span><a id="volver">◀ hilos</a></div>
  <div id="donde"><b id="aqui" title="la máquina que sirve esta página">telar</b><span id="icono" hidden></span><span id="visto"></span></div>
  <div class="der"><a data-p="dashboard">dashboard</a><a href="/maquinas" title="tus máquinas: elegir en cuál abrir la página">máquinas</a><a id="version" hidden></a><a data-p="config" class="config" title="configuración: de dónde sale la agenda, qué pestañas se ven…">⚙</a><span class="dim" id="maquina"></span></div>
</header>
<aside id="barra"></aside>
<div id="marcos"><nav id="acciones" hidden></nav><div id="vistas"></div><aside id="lado" hidden></aside></div>
<script>
// La página de telar: la barra de hilos a la izquierda y, a la derecha, el dashboard o un hilo (estatico/app.js,
// el mismo código del panel, empaquetado). «máquinas», arriba, es la página madre: elegir en cuál abrirla.
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function json(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }
window.telar = window.telar || {};
document.querySelector('header').addEventListener('click', (e) => {
  const p = e.target.dataset?.p;
  if (p && window.telar.mostrar) window.telar.mostrar(p);
});
$('#volver').addEventListener('click', () => { document.body.classList.remove('en-detalle'); document.body.classList.add('en-lista'); });
const angosto = window.matchMedia('(max-width: 700px)');
const ajustar = () => document.body.classList.toggle('angosto', angosto.matches);
angosto.addEventListener('change', ajustar); ajustar();
// al centro de la cabecera: la máquina que sirve esta página y lo que se ve. Un hilo de esta máquina, «› hilo»;
// uno de otra, «⇢ máquina:hilo» (llega reenviado por esta). Lo llama app.js al cambiar lo que se ve
let aqui = '';
window.telar.donde = (lo) => {
  const icono = $('#icono'), visto = $('#visto');
  icono.hidden = !lo; visto.textContent = lo ? lo.texto : '';
  if (!lo) return;
  icono.textContent = lo.otraMaquina ? '⇢' : '›';
  icono.className = lo.otraMaquina ? 'otra' : '';
  icono.title = lo.otraMaquina ? `de otra máquina: llega reenviado por ${aqui || 'esta'}` : `de esta máquina${aqui ? ` (${aqui})` : ''}`;
};
json('/api/salud').then((s) => {
  aqui = s.maquina || s.host || location.hostname;
  $('#maquina').textContent = `telar ${s.version}`;
  $('#aqui').textContent = aqui;
  $('#aqui').title = `esta página la sirve ${aqui}${s.host && s.host !== aqui ? ` (${s.host})` : ''} · ${location.host}`;
}).catch(() => { $('#maquina').textContent = 'sin API'; });
// instalable como app (y destino de «compartir» en el teléfono): el service worker no guarda nada
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
// modo desarrollo (`telar serve --web --dev`, scripts/dev.py): recargar cuando cambian los archivos de la
// página, y cuando el servidor vuelve después de reiniciarse (cambió el Python). Sin --dev, la ruta no existe
// (un 404) y el navegador deja de intentar
try {
  const dev = new EventSource('/dev/cambios');
  let caido = false;
  dev.onmessage = () => location.reload();
  dev.onopen = () => { if (caido) location.reload(); };
  dev.onerror = () => { if (dev.readyState === EventSource.CLOSED) dev.close(); else caido = true; };
} catch (e) { /* sin EventSource */ }
const app = document.createElement('script'); app.src = '/estatico/app.js';
app.onerror = () => { $('#vistas').textContent = 'no pude cargar la página (estatico/app.js)'; };
document.body.append(app);
</script></body></html>

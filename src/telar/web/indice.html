<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>telar</title>
<link rel="stylesheet" href="/estatico/marco.css"></head><body class="en-lista">
<header><a id="volver">◀ hilos</a><b>telar</b><span id="titulo" class="dim"></span>
  <a id="modo" hidden title="ver este hilo como terminal o como conversación">terminal</a><a data-p="dashboard">dashboard</a><a data-p="progreso">progreso</a><span class="dim" id="maquina"></span></header>
<aside id="barra"></aside>
<div id="marcos"><div id="progreso" hidden><div class="dim">leyendo…</div></div></div>
<script>
// La página de telar sin Node: la barra de hilos a la izquierda y, a la derecha, el dashboard o la
// conversación de un hilo (estatico/app.js, el mismo código del panel, empaquetado). Mientras se arma,
// «progreso» dice qué ya está en el navegador (estatico/progreso.json).
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function json(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }
async function progreso() {
  const p = await json('/estatico/progreso.json');
  const piezas = p.piezas || [];
  const hechas = piezas.filter((x) => x.estado === 'hecho').length;
  const h = [`<div class="dim">${esc(p.titulo)} · actualizado ${esc(p.actualizado)}</div>`,
    `<div class="barra"><i style="width:${Math.round(100 * hechas / Math.max(piezas.length, 1))}%"></i></div>`,
    `<div class="dim">${hechas} de ${piezas.length} piezas</div>`];
  let grupo = '';
  for (const x of piezas) {
    if (x.grupo !== grupo) { grupo = x.grupo; h.push(`<h2>${esc(grupo)}</h2>`); }
    const clase = x.estado === 'hecho' ? 'hecho' : x.estado === 'en curso' ? 'curso' : 'pendiente';
    h.push(`<div class="fila"><span class="${clase}">${x.estado === 'hecho' ? '✓' : x.estado === 'en curso' ? '…' : '·'} ${esc(x.estado)}</span><span>${esc(x.nombre)}${x.nota ? ` <span class="dim">— ${esc(x.nota)}</span>` : ''}</span></div>`);
  }
  $('#progreso').innerHTML = h.join('');
}
// lo que muestra la derecha lo decide app.js (window.telar.mostrar); «progreso» es de esta página
window.telar = window.telar || {};
window.telar.verProgreso = () => {
  document.querySelectorAll('#marcos iframe').forEach((f) => { f.hidden = true; });
  $('#progreso').hidden = false; $('#titulo').textContent = 'progreso'; $('#modo').hidden = true;
  progreso().catch((e) => { $('#progreso').textContent = e.message; });
};
document.querySelector('header').addEventListener('click', (e) => {
  const p = e.target.dataset?.p;
  if (e.target.id === 'modo') { window.telar.cambiarModo?.(); return; }
  if (p === 'progreso') { window.telar.verProgreso(); document.body.classList.replace('en-lista', 'en-detalle'); }
  else if (p && window.telar.mostrar) window.telar.mostrar(p);
});
$('#volver').addEventListener('click', () => { document.body.classList.remove('en-detalle'); document.body.classList.add('en-lista'); });
const angosto = window.matchMedia('(max-width: 700px)');
const ajustar = () => document.body.classList.toggle('angosto', angosto.matches);
angosto.addEventListener('change', ajustar); ajustar();
json('/api/salud').then((s) => { $('#maquina').textContent = `telar ${s.version}`; }).catch(() => { $('#maquina').textContent = 'sin API'; });
// instalable como app (y destino de «compartir» en el teléfono): el service worker no guarda nada
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
// modo desarrollo (`telar serve --web --dev`, scripts/dev.py): recargar cuando cambian los archivos de la
// página, y cuando el servidor vuelve después de reiniciarse (cambió el Python). Sin --dev, la ruta no existe
// (un 404) y el navegador deja de intentar
try {
  const dev = new EventSource('/dev/cambios');
  let caido = false;
  dev.onmessage = () => location.reload();
  dev.onopen = () => { if (caido) location.reload(); };
  dev.onerror = () => { if (dev.readyState === EventSource.CLOSED) dev.close(); else caido = true; };
} catch (e) { /* sin EventSource */ }
const app = document.createElement('script'); app.src = '/estatico/app.js';
app.onerror = () => window.telar.verProgreso();
document.body.append(app);
</script></body></html>

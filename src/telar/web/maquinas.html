<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>telar · máquinas</title>
<link rel="stylesheet" href="/estatico/marco.css">
<style>
/* La página madre: tus máquinas al centro, y alrededor un telar que teje. Los colores y la letra, de los tokens. */
body { display: block; height: 100dvh; overflow: hidden; }
#telar { position: fixed; inset: 0; width: 100%; height: 100%; }
main {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(56ch, calc(100vw - 4ch)); padding: var(--e-3) var(--h-2);
  border: var(--borde); background: var(--bg);
}
h1 { margin: 0 0 var(--e-2); font-size: var(--t-normal); font-weight: normal; color: var(--violeta); }
h1 small { color: var(--dim); margin-left: var(--h-1); }
.maquina {
  display: grid; grid-template-columns: 3ch 1fr auto; gap: var(--h-1); align-items: baseline;
  padding: var(--e-1) var(--h-1); color: var(--fg); text-decoration: none; border-left: 2px solid transparent;
}
a.maquina:hover, a.maquina:focus { background: var(--hover); border-left-color: var(--azul); outline: none; text-decoration: none; }
.maquina .tecla { color: var(--dim); }
.maquina .nombre { color: var(--amarillo); }
.maquina.aqui .nombre { color: var(--violeta); }
.maquina .estado { color: var(--dim); font-size: var(--t-chica); }
.maquina.fuera { color: var(--dim); }
.maquina.fuera .nombre { color: var(--dim); }
h2 { margin: var(--e-2) 0 var(--e-1); font-size: var(--t-chica); font-weight: normal; color: var(--dim); }
.servidor { padding: var(--e-1) var(--h-1); border-left: 2px solid transparent; }
.servidor .fila { display: grid; grid-template-columns: 1fr auto; gap: var(--h-1); align-items: baseline; }
.servidor .nombre { color: var(--cian); }
.servidor .estado { color: var(--dim); font-size: var(--t-chica); }
.servidor .estado.mal { color: var(--rojo); }
.servidor .estado.bien { color: var(--verde); }
.servidor input { width: 100%; box-sizing: border-box; margin-top: var(--e-1); background: var(--bg); color: var(--fg);
  border: var(--borde); font: inherit; font-size: var(--t-chica); padding: 0 var(--h-1); }
.servidor button { font: inherit; font-size: var(--t-chica); color: var(--azul); background: none; border: var(--borde);
  padding: 0 var(--h-1); cursor: pointer; margin-left: var(--h-1); }
.servidor button:hover, .servidor button:focus { background: var(--hover); outline: none; }
.servidor .gente { margin: var(--e-1) 0 0 var(--h-2); font-size: var(--t-chica); }
.servidor .gente > div { display: flex; justify-content: space-between; align-items: baseline; }
.pie { margin-top: var(--e-2); color: var(--dim); font-size: var(--t-chica); }
</style></head><body>
<canvas id="telar" aria-hidden="true"></canvas>
<main>
  <h1>telar <small>tus máquinas</small></h1>
  <div id="lista"><div class="pie">leyendo…</div></div>
  <div id="servidores"></div>
  <div id="agregados"></div>
  <div class="pie">1–9 abre · ⎋ vuelve · cada máquina sirve su página; se entra a otra con un boleto que vence en un minuto</div>
</main>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const edad = (s) => s == null ? '' : s < 90 ? `hace ${Math.round(s)} s` : s < 5400 ? `hace ${Math.round(s / 60)} min` : `hace ${Math.round(s / 3600)} h`;

// ── la lista: esta máquina y las del bus que sirven su página ───────────────────────────────────────
let maquinas = [];
async function leer() {
  const r = await fetch('/maquinas.json', { cache: 'no-store' });
  if (!r.ok) throw new Error(`la página respondió ${r.status}`);
  return r.json();
}
function pintar(d) {
  maquinas = d.maquinas || [];
  document.getElementById('lista').innerHTML = maquinas.map((m, i) => {
    const estado = m.aqui ? 'aquí' : !m.en_linea ? `fuera de línea · ${edad(m.edad)}` : !m.url ? 'no sirve su página' : `${m.hilos ?? 0} hilos vivos`;
    const clase = `maquina${m.aqui ? ' aqui' : ''}${!m.aqui && !m.url ? ' fuera' : ''}`;
    const fila = `<span class="tecla">${i < 9 ? i + 1 : ''}</span><span class="nombre">${m.aqui ? '◉' : m.url ? '●' : '○'} ${esc(m.nombre)}</span><span class="estado">${esc(estado)}</span>`;
    return m.aqui || m.url ? `<a class="${clase}" href="${m.aqui ? '/' : '#'}" data-i="${i}">${fila}</a>` : `<div class="${clase}">${fila}</div>`;
  }).join('');
}
// ── los servidores mainframe del bus: pedirles un lugar para tener hilos ahí ─────────────────────────
// (telar.alojamiento) El secreto del bus lo pone esta máquina; la página solo dice a cuál y con qué llave ssh.
const ESTADO = {
  pendiente: ['esperando que lo apruebe quien administra', ''], preparando: ['preparando tu lugar… (unos minutos)', ''],
  activo: ['tienes un lugar aquí: tu máquina sale arriba', 'bien'], falló: ['falló al prepararse', 'mal'],
  rechazado: ['pedido rechazado', 'mal'], quitado: ['tu lugar se cerró', 'mal'],
};
let servidores = [], abierto = null, aviso = '';
async function leerServidores() {
  const r = await fetch('/alojamiento.json', { cache: 'no-store' });
  if (!r.ok) throw new Error(`alojamiento: ${r.status}`);
  return (await r.json()).servidores || [];
}
function pintarServidores() {
  const cont = document.getElementById('servidores');
  if (!servidores.length) { cont.innerHTML = ''; return; }
  cont.innerHTML = '<h2>servidores · piden un lugar para tener hilos ahí</h2>' + servidores.map((sv, i) => {
    const mio = sv.alojamientos.find((a) => a.persona === sv.quien);
    const vigente = mio && !['rechazado', 'quitado'].includes(mio.estado);
    let estado = '<span class="estado">sin lugar todavía</span>', boton = '';
    if (sv.administra && !mio) estado = '<span class="estado">administras este servidor</span>';
    if (mio) {
      const [texto, clase] = ESTADO[mio.estado] || [mio.estado, ''];
      estado = `<span class="estado ${clase}">${esc(texto)}</span>`;
    }
    if (!sv.administra && !vigente && mio?.estado !== 'activo') {
      boton = abierto === i ? '' : `<button data-pedir="${i}">pedir un lugar</button>`;
    }
    const error = mio?.error ? `<div class="estado mal">${esc(mio.error)}</div>` : '';
    const form = abierto === i
      ? `<input id="llave-${i}" placeholder="llave ssh pública (opcional, para entrar también por ssh)" autocomplete="off">
         <div class="estado" style="margin-top:var(--e-1)"><button data-enviar="${i}">enviar pedido</button><button data-cancelar>cancelar</button></div>` : '';
    const gente = sv.administra ? `<div class="gente">${sv.alojamientos.map((a) => {
      const acciones = a.estado === 'pendiente' || a.estado === 'falló'
        ? `<span><button data-decidir="aprobar" data-persona="${esc(a.persona)}">aprobar</button><button data-decidir="rechazar" data-persona="${esc(a.persona)}">rechazar</button></span>`
        : a.estado === 'activo' ? `<span><button data-decidir="quitar" data-persona="${esc(a.persona)}">quitar</button></span>` : '';
      return `<div><span>${esc(a.persona)} · <span class="estado">${esc(a.estado)}</span></span>${acciones}</div>`;
    }).join('') || '<div class="estado">nadie ha pedido un lugar</div>'}</div>` : '';
    return `<div class="servidor"><div class="fila"><span class="nombre">⌂ ${esc(sv.nombre)}</span><span>${estado}${boton}</span></div>${error}${form}${gente}</div>`;
  }).join('') + (aviso ? `<div class="pie">${esc(aviso)}</div>` : '');
}
async function accionServidor(accion, cuerpo) {
  aviso = '';
  const r = await fetch(`/alojamiento/${accion}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) aviso = d.detail || `no se pudo (${r.status})`;
  else if (d.hecho) aviso = d.hecho;
  abierto = null;
  await vueltaServidores();
}
document.getElementById('servidores').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pedir !== undefined) { abierto = Number(b.dataset.pedir); pintarServidores(); document.getElementById(`llave-${abierto}`)?.focus(); }
  else if (b.dataset.cancelar !== undefined) { abierto = null; pintarServidores(); }
  else if (b.dataset.enviar !== undefined) accionServidor('pedir', { llave: document.getElementById(`llave-${b.dataset.enviar}`).value.trim() });
  else if (b.dataset.decidir) accionServidor(b.dataset.decidir, { persona: b.dataset.persona });
});
// no pisar el campo de la llave mientras se escribe
const vueltaServidores = () => abierto !== null ? Promise.resolve()
  : leerServidores().then((s) => { servidores = s; pintarServidores(); }).catch(() => {});
vueltaServidores(); setInterval(vueltaServidores, 5000);

// ── servidores agregados a mano (telar.servidores): su dirección, ver que hay un telar, y pedir entrar a su bus ──
const ENTRAR = {
  'sin-pedir': ['no has pedido entrar', ''], pidiendo: ['pidiendo entrar… (tu telar se reinicia un momento)', ''],
  pendiente: ['pediste entrar: espera que te apruebe quien lo administra', ''], rechazado: ['no te aprobaron', 'mal'],
  'falló': ['el pedido no se hizo: lo que pasó, en servidor-entrar.log', 'mal'],
  'en-su-bus': ['estás en su bus', 'bien'], 'otro-bus': ['estás en otro bus: un telar se conecta a uno solo', 'mal'],
};
let agregados = [], personaSugerida = '', agregando = false, entrando = null, avisoA = '';
function pintarAgregados() {
  const cont = document.getElementById('agregados');
  const filas = agregados.map((s, i) => {
    let [texto, clase] = ENTRAR[s.estado] || [s.estado, ''];
    if (s.estado === 'pendiente' && s.administra) texto = `pediste entrar como ${s.persona || '?'}: espera que ${s.administra} te apruebe`;
    if (s.estado === 'en-su-bus' && s.aloja) texto = 'estás en su bus: pide un lugar arriba, en «servidores»';
    const puede = ['sin-pedir', 'rechazado', 'falló'].includes(s.estado);
    const boton = puede && entrando !== i ? `<button data-entrar="${i}">pedir entrar</button>` : '';
    const form = entrando === i
      ? `<input id="persona-${i}" value="${esc(s.persona || personaSugerida)}" placeholder="tu nombre en el bus (minúsculas)" autocomplete="off">
         <div class="estado" style="margin-top:var(--e-1)">tu secreto se genera aquí y viaja solo su hash<button data-pedir-entrar="${i}">pedir</button><button data-cancelar-a>cancelar</button></div>` : '';
    return `<div class="servidor"><div class="fila"><span class="nombre">⌂ ${esc(s.nombre)} <span class="estado">· ${esc(s.url)}${s.administra ? ` · de ${esc(s.administra)}` : ''}</span></span>`
      + `<span>${boton}<button data-olvidar="${i}" title="olvidarlo aquí (en el servidor no cambia nada)">×</button></span></div>`
      + `<div class="estado ${clase}">${esc(texto)}</div>${form}</div>`;
  }).join('');
  const agregar = agregando
    ? `<div class="servidor"><input id="direccion" placeholder="la IP de Tailscale del servidor, su nombre, o su https://…" autocomplete="off">
       <div class="estado" style="margin-top:var(--e-1)"><button data-buscar>buscar</button><button data-cancelar-a>cancelar</button></div></div>`
    : '<div class="servidor"><button data-agregar>＋ agregar un servidor</button></div>';
  cont.innerHTML = `<h2>otros servidores · por su dirección</h2>${filas}${agregar}` + (avisoA ? `<div class="pie">${esc(avisoA)}</div>` : '');
}
async function accionAgregados(accion, cuerpo) {
  avisoA = 'un momento…'; pintarAgregados();
  const r = await fetch(`/servidores/${accion}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const d = await r.json().catch(() => ({}));
  avisoA = !r.ok ? (d.detail || `no se pudo (${r.status})`) : (d.hecho || '');
  if (r.ok) { agregando = false; entrando = null; }
  await vueltaAgregados(true);
}
document.getElementById('agregados').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.agregar !== undefined) { agregando = true; pintarAgregados(); document.getElementById('direccion')?.focus(); }
  else if (b.dataset.cancelarA !== undefined) { agregando = false; entrando = null; pintarAgregados(); }
  else if (b.dataset.buscar !== undefined) accionAgregados('agregar', { direccion: document.getElementById('direccion').value.trim() });
  else if (b.dataset.entrar !== undefined) { entrando = Number(b.dataset.entrar); pintarAgregados(); document.getElementById(`persona-${entrando}`)?.focus(); }
  else if (b.dataset.pedirEntrar !== undefined) {
    const s = agregados[Number(b.dataset.pedirEntrar)];
    accionAgregados('entrar', { url: s.url, persona: document.getElementById(`persona-${b.dataset.pedirEntrar}`).value.trim() });
  } else if (b.dataset.olvidar !== undefined) accionAgregados('quitar', { url: agregados[Number(b.dataset.olvidar)].url });
});
document.getElementById('agregados').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.stopPropagation();
  if (e.target.id === 'direccion') accionAgregados('agregar', { direccion: e.target.value.trim() });
  else if (e.target.id?.startsWith('persona-')) {
    const i = Number(e.target.id.slice(8));
    accionAgregados('entrar', { url: agregados[i].url, persona: e.target.value.trim() });
  }
});
// no pisar lo que se escribe; mientras se pide entrar, el servicio se reinicia: los errores de red se callan
const vueltaAgregados = (forzar = false) => (!forzar && (agregando || entrando !== null)) ? Promise.resolve()
  : fetch('/servidores.json', { cache: 'no-store' }).then((r) => r.json())
    .then((d) => { agregados = d.servidores || []; personaSugerida = d.persona || ''; pintarAgregados(); }).catch(() => {});
vueltaAgregados(); setInterval(vueltaAgregados, 5000);

// a otra máquina se entra con un boleto nuevo (vence en un minuto): se pide al momento de ir
async function ir(i) {
  const m = maquinas[i];
  if (!m) return;
  if (m.aqui) { location.href = '/'; return; }
  try {
    const d = await leer();
    const fresca = (d.maquinas || []).find((x) => x.nombre === m.nombre);
    if (fresca && fresca.url) location.href = fresca.url;
    else pintar(d);
  } catch (e) { /* sin conexión: se queda aquí */ }
}
document.getElementById('lista').addEventListener('click', (e) => {
  const a = e.target.closest('a.maquina');
  if (!a) return;
  e.preventDefault();
  ir(Number(a.dataset.i));
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input')) return;
  if (e.key === 'Escape') { location.href = '/'; return; }
  if (/^[1-9]$/.test(e.key)) ir(Number(e.key) - 1);
});
const vuelta = () => leer().then(pintar).catch((e) => { document.getElementById('lista').innerHTML = `<div class="pie">${esc(e.message)}</div>`; });
vuelta(); setInterval(vuelta, 15000);

// ── el telar: la urdimbre baja en vertical y la lanzadera va y viene tejiendo filas de colores. La tela
// tejida baja, como en un telar de verdad, y arriba de la línea del tejido quedan los hilos sueltos ──────────
const lienzo = document.getElementById('telar'), ctx = lienzo.getContext('2d');
const css = getComputedStyle(document.documentElement), tok = (n) => css.getPropertyValue('--' + n).trim();
// un color de los tokens, ya resuelto (el canvas no entiende var() ni color-mix): lo resuelve el navegador
const muestra = document.createElement('i'); document.body.append(muestra);
const color = (n) => { muestra.style.color = `var(--${n})`; return getComputedStyle(muestra).color; };
const PALETA = ['violeta', 'azul', 'cian', 'verde', 'amarillo', 'magenta', 'rojo'].map(color);
const URDIMBRE = color('linea'), LANZADERA = color('fg'), FONDO = color('bg');
muestra.remove();
let cw = 8, ch = 16, cols = 0, filas = 0, linea = 0, tela = [], fila = null, x = 0, dir = 1, n = 0;
function medir() {
  const dpr = window.devicePixelRatio || 1;
  lienzo.width = innerWidth * dpr; lienzo.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${tok('tam') || '13px'} ${tok('letra') || 'monospace'}`; ctx.textBaseline = 'top';
  cw = Math.ceil(ctx.measureText('─').width); ch = Math.ceil(cw * 1.9);
  cols = Math.ceil(innerWidth / cw); filas = Math.ceil(innerHeight / ch); linea = Math.floor(filas * 0.42);
  tela = tela.slice(0, filas); dibujarTodo();
}
// una fila de tela: la trama (de un color) y por dónde pasa sobre la urdimbre (un sarga 2/2, que corre)
function nuevaFila() { return { color: PALETA[Math.floor(n / 3) % PALETA.length], corrida: n++ % 4, hecha: [] }; }
function celda(f, c) {
  // columnas pares: hilos de la urdimbre; impares: la trama entre ellos
  if (c % 2 === 0) return ((c / 2 + f.corrida) % 4) < 2 ? ['│', URDIMBRE] : ['─', f.color];
  return ['─', f.color];
}
function dibujarFila(y, f, hasta) {
  ctx.fillStyle = FONDO; ctx.fillRect(0, y * ch, innerWidth, ch);
  for (let c = 0; c < cols; c++) {
    let [g, color] = c % 2 === 0 ? ['│', URDIMBRE] : [' ', FONDO];
    if (f && (hasta === undefined || (dir > 0 ? c < hasta : c > hasta))) [g, color] = celda(f, c);
    if (g === ' ') continue;
    ctx.fillStyle = color; ctx.fillText(g, c * cw, y * ch);
  }
}
function dibujarTodo() {
  ctx.fillStyle = FONDO; ctx.fillRect(0, 0, innerWidth, innerHeight);
  for (let y = 0; y < filas; y++) {
    if (y < linea) dibujarFila(y, null);                    // los hilos sueltos, arriba
    else if (y === linea) dibujarFila(y, fila, x);           // la fila que se está tejiendo
    else dibujarFila(y, tela[y - linea - 1]);                // la tela, que baja
  }
  if (fila) { ctx.fillStyle = LANZADERA; ctx.fillText(dir > 0 ? '▶' : '◀', x * cw, linea * ch); }
}
function paso() {
  if (!fila) { fila = nuevaFila(); x = dir > 0 ? 0 : cols - 1; }
  x += dir * 2;
  if (x < 0 || x >= cols) {
    // la fila quedó tejida: la tela baja una, y la lanzadera vuelve por la siguiente
    tela.unshift(fila); tela.length = Math.min(tela.length, filas);
    fila = null; dir = -dir; dibujarTodo(); return;
  }
  dibujarFila(linea, fila, x);
  ctx.fillStyle = LANZADERA; ctx.fillText(dir > 0 ? '▶' : '◀', x * cw, linea * ch);
}
addEventListener('resize', medir);
medir();
// al abrir, ya hay algo de tela tejida
for (let i = 0; i < Math.min(12, filas - linea - 1); i++) tela.unshift(nuevaFila());
dibujarTodo();
// sin animación si quien mira pidió menos movimiento: la tela queda tejida y quieta
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { for (let i = 0; i < filas; i++) { tela.unshift(nuevaFila()); } dibujarTodo(); }
else setInterval(paso, 28);
</script></body></html>
